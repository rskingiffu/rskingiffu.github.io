            <text x="485" y="64" font-size="14" text-anchor="middle" fill="currentColor">常見用途</text>
            <text x="110" y="104" font-size="14" text-anchor="middle" fill="currentColor">5 ~ 15</text>
            <text x="170" y="104" font-size="14" fill="currentColor">非常泛光</text>
            <text x="400" y="104" font-size="14" fill="currentColor">露營、近距離工作</text>
            <text x="110" y="144" font-size="14" text-anchor="middle" fill="currentColor">15 ~ 35</text>
