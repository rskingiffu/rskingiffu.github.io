<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="橙光摘要：紅光場合想要顏色時的折衷" color="#7d7d7d">
  <circle cx="131" cy="84" r="28" fill="#7f1d1d"/>
  <circle cx="131" cy="84" r="12" fill="#ef4444"/>
  <text x="131" y="132" text-anchor="middle" fill="#b91c1c" font-size="12" font-family="sans-serif">紅光　幾乎無色</text>

  <circle cx="549" cy="84" r="28" fill="#9a3412"/>
  <circle cx="549" cy="84" r="16" fill="#f97316"/>
  <circle cx="549" cy="84" r="6" fill="#fdba74"/>
  <text x="549" y="132" text-anchor="middle" fill="#b45309" font-size="12" font-family="sans-serif">橙光　較亮有細節</text>

  <text x="340" y="32" text-anchor="middle" fill="currentColor" font-size="18" font-family="sans-serif" font-weight="700">橙光摘要</text>
  <text x="340" y="108" text-anchor="middle" fill="currentColor" font-size="13" font-family="sans-serif">要夜視、又想看一點顏色時的折衷</text>

  <rect x="28" y="156" width="624" height="220" rx="10" fill="none" stroke="#94a3b8"/>
  <text x="92" y="180" fill="currentColor" font-size="12" font-family="sans-serif">項目</text>
  <text x="360" y="180" fill="currentColor" font-size="12" font-family="sans-serif">重點</text>
  <line x1="28" y1="192" x2="652" y2="192" stroke="#94a3b8"/>
  <line x1="176" y1="156" x2="176" y2="376" stroke="#94a3b8"/>

  <text x="44" y="220" fill="currentColor" font-size="13" font-family="sans-serif">本質</text>
  <text x="188" y="220" fill="currentColor" font-size="13" font-family="sans-serif">多為藍光 + 特製螢光粉，接近白光但藍光較少</text>

  <line x1="28" y1="236" x2="652" y2="236" stroke="#cbd5e1"/>
  <text x="44" y="264" fill="currentColor" font-size="13" font-family="sans-serif">優點</text>
  <text x="188" y="264" fill="currentColor" font-size="13" font-family="sans-serif">比紅光亮、細節較好；煙霧塵裡對比有時優於冷白</text>

  <line x1="28" y1="280" x2="652" y2="280" stroke="#cbd5e1"/>
  <text x="44" y="308" fill="currentColor" font-size="13" font-family="sans-serif">用途</text>
  <text x="188" y="308" fill="currentColor" font-size="13" font-family="sans-serif">少引蟲、兼狩獵；比純紅光能看出部分顏色</text>

  <line x1="28" y1="324" x2="652" y2="324" stroke="#cbd5e1"/>
  <text x="44" y="352" fill="currentColor" font-size="13" font-family="sans-serif">選購</text>
  <text x="188" y="352" fill="#b91c1c" font-size="13" font-family="sans-serif">少找自發光橙；多數如 M7-AM 都是螢光粉版</text>
</svg>
