<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="輝度摘要：單位面積有多濃、多刺">
  <defs>
    <radialGradient id="hi" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff4c2"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="340" y="32" text-anchor="middle" fill="#7d7d7d" font-size="18" font-family="sans-serif" font-weight="700">輝度摘要</text>

  <rect x="88" y="56" width="72" height="72" rx="6" fill="none" stroke="#94a3b8"/>
  <circle cx="124" cy="92" r="22" fill="url(#lo)"/>
  <text x="124" y="150" text-anchor="middle" fill="#2563eb" font-size="12" font-family="sans-serif">面積大 → 淡</text>

  <rect x="520" y="62" width="48" height="48" rx="5" fill="none" stroke="#94a3b8"/>
  <circle cx="544" cy="86" r="14" fill="url(#hi)"/>
  <text x="544" y="150" text-anchor="middle" fill="#b45309" font-size="12" font-family="sans-serif">面積小 → 濃</text>

  <text x="340" y="108" text-anchor="middle" fill="#7d7d7d" font-size="13" font-family="sans-serif">同樣 lm，壓進更小面積 = 更高輝度</text>

  <rect x="28" y="172" width="624" height="204" rx="10" fill="none" stroke="#94a3b8"/>

  <text x="86" y="196" fill="#7d7d7d" font-size="12" font-family="sans-serif">項目</text>
  <text x="360" y="196" fill="#7d7d7d" font-size="12" font-family="sans-serif">重點</text>
  <line x1="28" y1="208" x2="652" y2="208" stroke="#94a3b8"/>
  <line x1="176" y1="172" x2="176" y2="376" stroke="#94a3b8"/>

  <text x="44" y="236" fill="#7d7d7d" font-size="13" font-family="sans-serif">定義</text>
  <text x="188" y="236" fill="#7d7d7d" font-size="13" font-family="sans-serif">單位面積的發光強度（cd/m² 或 cd/mm²）</text>

  <line x1="28" y1="250" x2="652" y2="250" stroke="#cbd5e1"/>
  <text x="44" y="278" fill="#7d7d7d" font-size="13" font-family="sans-serif">白話</text>
  <text x="188" y="278" fill="#7d7d7d" font-size="13" font-family="sans-serif">LED 表面有多濃、多刺；越高越有遠射天分</text>

  <line x1="28" y1="292" x2="652" y2="292" stroke="#cbd5e1"/>
  <text x="44" y="320" fill="#7d7d7d" font-size="13" font-family="sans-serif">重要性</text>
  <text x="188" y="320" fill="#7d7d7d" font-size="13" font-family="sans-serif">高 cd 的根本條件之一</text>

  <line x1="28" y1="334" x2="652" y2="334" stroke="#cbd5e1"/>
  <text x="44" y="362" fill="#7d7d7d" font-size="13" font-family="sans-serif">結果</text>
  <text x="188" y="362" fill="#7d7d7d" font-size="13" font-family="sans-serif">同樣總流明，面積越小越容易做出小而亮的熱點</text>
</svg>
