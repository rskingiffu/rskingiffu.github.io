<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="藍光摘要：短波長、易刺眼，用途偏取證" color="#7d7d7d">
  <circle cx="131" cy="84" r="28" fill="#1e3a8a"/>
  <circle cx="131" cy="84" r="14" fill="#3b82f6"/>
  <circle cx="131" cy="84" r="5" fill="#bfdbfe"/>
  <text x="131" y="132" text-anchor="middle" fill="#2563eb" font-size="12" font-family="sans-serif">短波長　散射強</text>

  <circle cx="549" cy="84" r="28" fill="#1e293b"/>
  <circle cx="549" cy="84" r="16" fill="#334155"/>
  <path d="M536,80 L562,80 L549,96 Z" fill="#f59e0b"/>
  <text x="549" y="132" text-anchor="middle" fill="#b45309" font-size="12" font-family="sans-serif">常需橘／黃濾鏡</text>

  <text x="340" y="32" text-anchor="middle" fill="#2563eb" font-size="18" font-family="sans-serif" font-weight="700">藍光摘要</text>
  <text x="340" y="108" text-anchor="middle" fill="currentColor" font-size="13" font-family="sans-serif">白光 LED 離不開藍光，但「純藍光」本身用途很窄</text>

  <rect x="28" y="156" width="624" height="220" rx="10" fill="none" stroke="#94a3b8"/>
  <text x="92" y="180" fill="currentColor" font-size="12" font-family="sans-serif">項目</text>
  <text x="360" y="180" fill="currentColor" font-size="12" font-family="sans-serif">重點</text>
  <line x1="28" y1="192" x2="652" y2="192" stroke="#94a3b8"/>
  <line x1="176" y1="156" x2="176" y2="376" stroke="#94a3b8"/>

  <text x="44" y="220" fill="currentColor" font-size="13" font-family="sans-serif">特性</text>
  <text x="188" y="220" fill="#b91c1c" font-size="13" font-family="sans-serif">易刺眼，對暗適應破壞大</text>

  <line x1="28" y1="236" x2="652" y2="236" stroke="#cbd5e1"/>
  <text x="44" y="264" fill="currentColor" font-size="13" font-family="sans-serif">用途</text>
  <text x="188" y="264" fill="currentColor" font-size="13" font-family="sans-serif">取證看螢光反應；少數夜釣</text>

  <line x1="28" y1="280" x2="652" y2="280" stroke="#cbd5e1"/>
  <text x="44" y="308" fill="currentColor" font-size="13" font-family="sans-serif">觀察</text>
  <text x="188" y="308" fill="currentColor" font-size="13" font-family="sans-serif">取證時搭配橘／黃濾鏡護目鏡</text>

  <line x1="28" y1="324" x2="652" y2="324" stroke="#cbd5e1"/>
  <text x="44" y="352" fill="currentColor" font-size="13" font-family="sans-serif">選購</text>
  <text x="188" y="352" fill="#b91c1c" font-size="13" font-family="sans-serif">日常不如 365 nm UVA；一般玩家多半不必買</text>
</svg>
