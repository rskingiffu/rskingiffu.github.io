<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" aria-label="手電筒結構示意，強調筒身" color="#7d7d7d">
  <defs>
    <linearGradient id="headGlowB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B89A"></stop>
      <stop offset="55%" stop-color="#A89870"></stop>
      <stop offset="100%" stop-color="#8A7A52"></stop>
    </linearGradient>
    <linearGradient id="lensGradB" x1="0" y1="0" x2="0" y2="1">
