  <rect x="248" y="168" width="24" height="24" rx="3" fill="#9A4A12" opacity="0.7"></rect>
  <ellipse cx="214" cy="180" rx="38" ry="62" fill="none" stroke="#E8D9B0" stroke-width="2" opacity="0.35"></ellipse>
