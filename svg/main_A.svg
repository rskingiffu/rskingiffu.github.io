<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" aria-label="手電筒結構示意，強調燈頭光學區">
  <defs>
    <linearGradient id="headGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6C15A"></stop>
      <stop offset="55%" stop-color="#E89A2B"></stop>
      <stop offset="100%" stop-color="#D14520"></stop>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E0" stop-opacity="0.95"></stop>
      <stop offset="50%" stop-color="#F2A623" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#E85D24" stop-opacity="0.35"></stop>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D6CE"></stop>
      <stop offset="50%" stop-color="#9A9890"></stop>
      <stop offset="100%" stop-color="#6F6D66"></stop>
    </linearGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4"></stop>
      <stop offset="45%" stop-color="#F2A623"></stop>
      <stop offset="100%" stop-color="#D14520" stop-opacity="0.15"></stop>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"></feGaussianBlur>
    </filter>
  </defs>

  
  <ellipse cx="210" cy="180" rx="168" ry="118" fill="#F2A623" opacity="0.10" filter="url(#soft)"></ellipse>
  <ellipse cx="210" cy="180" rx="92" ry="92" fill="url(#hotspot)" opacity="0.45"></ellipse>

  <rect x="781" y="156" width="18" height="48" rx="5" fill="#6F6D66" stroke="#4A4946"></rect>
  <circle cx="790" cy="180" r="7" fill="#3F3E3B"></circle>

  <rect x="430" y="154" width="285" height="52" rx="8" fill="url(#bodyGrad)" stroke="#595958" stroke-width="1.5"></rect>

  <rect x="713" y="148" width="78" height="64" rx="10" fill="url(#bodyGrad)" stroke="#595958" stroke-width="1.5"></rect>
  
  <g stroke="#7A7871" stroke-width="1" opacity="0.55">
    <line x1="550" y1="158" x2="550" y2="202"></line>
    <line x1="570" y1="158" x2="570" y2="202"></line>
    <line x1="590" y1="158" x2="590" y2="202"></line>
    <line x1="610" y1="158" x2="610" y2="202"></line>
    <line x1="630" y1="158" x2="630" y2="202"></line>
    <line x1="650" y1="158" x2="650" y2="202"></line>
  </g>

  <rect x="460" y="172" width="54" height="16" rx="6" fill="#8B897F" stroke="#595958"></rect>
  <rect x="474" y="176" width="26" height="8" rx="3" fill="#D14520" opacity="0.85"></rect>


  <path d="M 360 140 L 430 154 L 430 206 L 360 220 Z" fill="#B8A070" stroke="#8A6A30" stroke-width="1.2"></path>



  <path d="M 168 108
           L 360 128
           L 360 232
           L 168 252
           Q 132 180 168 108 Z" fill="url(#headGlow)" stroke="#B45312" stroke-width="2"></path>

  
  <ellipse cx="214" cy="180" rx="38" ry="62" fill="none" stroke="#FFF1C2" stroke-width="3" opacity="0.55"></ellipse>
  <ellipse cx="238" cy="180" rx="28" ry="48" fill="none" stroke="#FFE08A" stroke-width="2" opacity="0.7"></ellipse>
  <ellipse cx="256" cy="180" rx="16" ry="30" fill="#FFF6D8" opacity="0.35"></ellipse>


  <rect x="248" y="168" width="24" height="24" rx="3" fill="#D14520"></rect>
  <rect x="253" y="173" width="14" height="14" rx="2" fill="#F6C15A"></rect>

  
  <rect x="118" y="96" width="54" height="168" rx="10" fill="#E89A2B" stroke="#9A4A12" stroke-width="2"></rect>

  <ellipse cx="122" cy="180" rx="18" ry="78" fill="url(#lensGrad)" stroke="#FFF6E0" stroke-width="2"></ellipse>
  <ellipse cx="116" cy="180" rx="6" ry="52" fill="#FFFFFF" opacity="0.35"></ellipse>


  <g font-family="system-ui, sans-serif">
    <text x="210" y="78" font-size="18" font-weight="600" fill="#D14520" text-anchor="middle">燈頭／光學區</text>

    <text x="605" y="122" font-size="14" fill="#6F6D66" text-anchor="middle">筒身</text>
  </g>


  <g stroke="#D14520" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M 210 86 L 210 108"></path>
    <path d="M 605 128 L 605 150"></path>

  </g>
</svg>
