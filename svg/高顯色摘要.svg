<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="高顯色摘要：Ra70 與 Ra90 對照" color="#7d7d7d">
  <rect x="88" y="56" width="86" height="56" rx="6" fill="#c8c4bb" stroke="#94a3b8"/>
  <rect x="96" y="68" width="18" height="32" fill="#9aa88a"/>
  <rect x="122" y="68" width="18" height="32" fill="#b7a39a"/>
  <rect x="148" y="68" width="18" height="32" fill="#a8aeb4"/>
  <text x="131" y="132" text-anchor="middle" fill="#2563eb" font-size="12" font-family="sans-serif">Ra 70　偏灰白</text>

  <rect x="506" y="56" width="86" height="56" rx="6" fill="#f3efe6" stroke="#94a3b8"/>
  <rect x="514" y="68" width="18" height="32" fill="#2f9e44"/>
  <rect x="540" y="68" width="18" height="32" fill="#dc2626"/>
  <rect x="566" y="68" width="18" height="32" fill="#2563eb"/>
  <text x="549" y="132" text-anchor="middle" fill="#b45309" font-size="12" font-family="sans-serif">Ra 90+　辨色準</text>

  <text x="340" y="32" text-anchor="middle" fill="currentColor" font-size="18" font-family="sans-serif" font-weight="700">高顯色摘要</text>
  <text x="340" y="108" text-anchor="middle" fill="currentColor" font-size="13" font-family="sans-serif">室內化妝／裝修、室外辨色都更吃 CRI</text>

  <rect x="28" y="156" width="624" height="220" rx="10" fill="none" stroke="#94a3b8"/>
  <text x="78" y="180" fill="currentColor" font-size="12" font-family="sans-serif">項目</text>
  <text x="248" y="180" fill="#2563eb" font-size="12" font-family="sans-serif">低顯色 Ra 70</text>
  <text x="468" y="180" fill="#b45309" font-size="12" font-family="sans-serif">高顯色 Ra 90+</text>
  <line x1="28" y1="192" x2="652" y2="192" stroke="#94a3b8"/>
  <line x1="168" y1="156" x2="168" y2="376" stroke="#94a3b8"/>
  <line x1="396" y1="156" x2="396" y2="376" stroke="#94a3b8"/>

  <text x="40" y="220" fill="currentColor" font-size="13" font-family="sans-serif">畫面</text>
  <text x="180" y="220" fill="currentColor" font-size="13" font-family="sans-serif">綠／紅不夠，偏假、死白</text>
  <text x="408" y="220" fill="currentColor" font-size="13" font-family="sans-serif">紅綠較完整，色彩較準</text>

  <line x1="28" y1="236" x2="652" y2="236" stroke="#cbd5e1"/>
  <text x="40" y="264" fill="currentColor" font-size="13" font-family="sans-serif">代價</text>
  <text x="180" y="264" fill="#15803d" font-size="13" font-family="sans-serif">lm／光效／遠射較佳</text>
  <text x="408" y="264" fill="#b91c1c" font-size="13" font-family="sans-serif">紅粉耗能，較熱、lm 較低</text>

  <line x1="28" y1="280" x2="652" y2="280" stroke="#cbd5e1"/>
  <text x="40" y="308" fill="currentColor" font-size="13" font-family="sans-serif">色溫</text>
  <text x="180" y="308" fill="currentColor" font-size="13" font-family="sans-serif">高色溫也常見</text>
  <text x="408" y="308" fill="currentColor" font-size="13" font-family="sans-serif">多半偏低色溫才容易有</text>

  <line x1="28" y1="324" x2="652" y2="324" stroke="#cbd5e1"/>
  <text x="40" y="352" fill="currentColor" font-size="13" font-family="sans-serif">紅色</text>
  <text x="180" y="352" fill="#b91c1c" font-size="13" font-family="sans-serif">常缺紅</text>
  <text x="408" y="352" fill="currentColor" font-size="13" font-family="sans-serif">還要看 R9（519A 常 ≥80）</text>
</svg>
