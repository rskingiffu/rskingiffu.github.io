<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="UV 365nm 摘要：看的是螢光反應不是紫光" color="#7d7d7d">
  <circle cx="131" cy="84" r="28" fill="#3b0764"/>
  <circle cx="131" cy="84" r="14" fill="#7c3aed"/>
  <circle cx="131" cy="84" r="5" fill="#e9d5ff"/>
  <text x="131" y="132" text-anchor="middle" fill="#8033ff" font-size="12" font-family="sans-serif">365 nm　UVA</text>

  <circle cx="549" cy="84" r="28" fill="#111827"/>
  <circle cx="549" cy="84" r="16" fill="#22c55e"/>
  <circle cx="549" cy="84" r="6" fill="#bbf7d0"/>
  <text x="549" y="132" text-anchor="middle" fill="#15803d" font-size="12" font-family="sans-serif">重點是螢光</text>

  <text x="340" y="32" text-anchor="middle" fill="#8033ff" font-size="18" font-family="sans-serif" font-weight="700">UV 摘要</text>
  <text x="340" y="108" text-anchor="middle" fill="currentColor" font-size="13" font-family="sans-serif">EDC 常有、少開，但一用就很實用</text>

  <rect x="28" y="156" width="624" height="220" rx="10" fill="none" stroke="#94a3b8"/>
  <text x="92" y="180" fill="currentColor" font-size="12" font-family="sans-serif">項目</text>
  <text x="360" y="180" fill="currentColor" font-size="12" font-family="sans-serif">重點</text>
  <line x1="28" y1="192" x2="652" y2="192" stroke="#94a3b8"/>
  <line x1="176" y1="156" x2="176" y2="376" stroke="#94a3b8"/>

  <text x="44" y="220" fill="currentColor" font-size="13" font-family="sans-serif">看什麼</text>
  <text x="188" y="220" fill="currentColor" font-size="13" font-family="sans-serif">不是看紫光，是看被激發的螢光</text>

  <line x1="28" y1="236" x2="652" y2="236" stroke="#cbd5e1"/>
  <text x="44" y="264" fill="currentColor" font-size="13" font-family="sans-serif">濾片</text>
  <text x="188" y="264" fill="currentColor" font-size="13" font-family="sans-serif">ZWB2 黑濾片可大幅突出螢光</text>

  <line x1="28" y1="280" x2="652" y2="280" stroke="#cbd5e1"/>
  <text x="44" y="308" fill="currentColor" font-size="13" font-family="sans-serif">用途</text>
  <text x="188" y="308" fill="currentColor" font-size="13" font-family="sans-serif">驗鈔、琥珀蜜蠟、貓癬、防霉、廚衛漏水</text>

  <line x1="28" y1="324" x2="652" y2="324" stroke="#cbd5e1"/>
  <text x="44" y="352" fill="currentColor" font-size="13" font-family="sans-serif">定位</text>
  <text x="188" y="352" fill="currentColor" font-size="13" font-family="sans-serif">少用，但需要螢光判斷時往往最重要</text>
</svg>
