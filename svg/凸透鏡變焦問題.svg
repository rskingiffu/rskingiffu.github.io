<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
  
  <rect x="40" y="30" width="640" height="220" fill="none" stroke="#87867F" stroke-width="0.5"></rect>
  
  
  <rect x="40" y="30" width="640" height="40" fill="none" stroke="#87867F" stroke-width="0.5"></rect>
  
  
  <line x1="160" y1="30" x2="160" y2="250" stroke="#B4B2A9" stroke-width="0.5"></line>
  <line x1="420" y1="30" x2="420" y2="250" stroke="#B4B2A9" stroke-width="0.5"></line>
  
  
  <line x1="40" y1="70" x2="680" y2="70" stroke="#B4B2A9" stroke-width="0.5"></line>
  <line x1="40" y1="115" x2="680" y2="115" stroke="#B4B2A9" stroke-width="0.5"></line>
  <line x1="40" y1="160" x2="680" y2="160" stroke="#B4B2A9" stroke-width="0.5"></line>
  <line x1="40" y1="205" x2="680" y2="205" stroke="#B4B2A9" stroke-width="0.5"></line>
  
  
  <text x="100" y="55" font-size="14" text-anchor="middle" fill="#7d7d7d">問題</text>
  <text x="290" y="55" font-size="14" text-anchor="middle" fill="#7d7d7d">說明</text>
  <text x="550" y="55" font-size="14" text-anchor="middle" fill="#7d7d7d">影響</text>
  
  
  <text x="100" y="95" font-size="13" text-anchor="middle" fill="#7d7d7d">光損耗高</text>
  <text x="170" y="90" font-size="12" fill="#7d7d7d">非球面透鏡無法像深反光杯或優質TIR</text>
  <text x="170" y="106" font-size="12" fill="#7d7d7d">那樣高效收集側向光</text>
  <text x="430" y="95" font-size="12" fill="#7d7d7d">同樣功率下，實際可用流明明顯較低</text>
  
  
  <text x="100" y="140" font-size="13" text-anchor="middle" fill="#7d7d7d">發熱嚴重</text>
  <text x="170" y="140" font-size="12" fill="#7d7d7d">光轉換效率差 → 更多能量變成熱</text>
  <text x="170" y="151" font-size="12" fill="#7d7d7d"></text>
  <text x="430" y="135" font-size="12" fill="#7d7d7d">LED與驅動板溫度高，容易觸發降檔</text>
  <text x="430" y="151" font-size="12" fill="#7d7d7d">續航虛標</text>
  
  
  <text x="100" y="185" font-size="13" text-anchor="middle" fill="#7d7d7d">LED投影失真</text>
  <text x="170" y="185" font-size="12" fill="#7d7d7d">直接成像LED晶粒形狀與結構</text>
  <text x="170" y="196" font-size="12" fill="#7d7d7d"></text>
  <text x="430" y="180" font-size="12" fill="#7d7d7d">容易出現方塊、環狀、多核心分格</text>
  <text x="430" y="196" font-size="12" fill="#7d7d7d">等醜陋光斑</text>
  
  
  <text x="100" y="230" font-size="13" text-anchor="middle" fill="#7d7d7d">變焦機構品質差</text>
  <text x="170" y="230" font-size="12" fill="#7d7d7d">塑膠螺紋、間隙大</text>
  <text x="170" y="241" font-size="12" fill="#7d7d7d"></text>
  <text x="430" y="230" font-size="12" fill="#7d7d7d">容易鬆動、進水、對焦不精準</text>
</svg>
